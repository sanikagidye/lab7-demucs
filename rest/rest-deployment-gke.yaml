
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest
  template:
    metadata:
      labels:
        app: rest
    spec:
      containers:
        - name: rest
          image: us-west1-docker.pkg.dev/demucs-513803/lab7-images/demucs-rest:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: MINIO_HOST
              value: "minio:9000"
            - name: MINIO_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: username
            - name: MINIO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: rest-service
spec:
  type: ClusterIP
  selector:
    app: rest
  ports:
    - port: 5000
      targetPort: 5000
